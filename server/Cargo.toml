[workspace]
resolver = "3"
# Every crate under crates/ is a member: blue-protocol now; blue-native,
# blue-server and blue-bot join automatically when they are created.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
# Denied workspace-wide; blue-native is the only crate allowed to opt out
# (`#![allow(unsafe_code)]`), blue-protocol forbids it outright.
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Selected pedantic lints.
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
doc_markdown = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
# Data from the network must never panic the server.
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
