name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc-debug,    os: windows-latest, preset: x64-debug }
          - { name: windows-msvc-release,  os: windows-latest, preset: x64-release }
          - { name: linux-gcc-debug,       os: ubuntu-latest,  preset: linux-gcc-debug }
          - { name: linux-gcc-release,     os: ubuntu-latest,  preset: linux-gcc-release }
          - { name: linux-clang-debug,     os: ubuntu-latest,  preset: linux-clang-debug }
          - { name: linux-clang-release,   os: ubuntu-latest,  preset: linux-clang-release }
          - { name: macos-arm64-debug,     os: macos-latest,   preset: macos-arm64-debug }
          - { name: macos-arm64-release,   os: macos-latest,   preset: macos-arm64-release }
    env:
      # Dependencies are fetched once per runner and cached below.
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld ccache zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install ninja sccache --no-progress -y

      # The LunarG SDK provides Vulkan headers/loader (MoltenVK on macOS) and slangc / the Slang
      # library the shader build needs (VULKAN_SDK is exported by the action).
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: false

      - name: Developer command prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'tests/CMakeLists.txt') }}

      - name: Cache compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ~/AppData/Local/Mozilla/sccache
          key: cc-${{ matrix.name }}-${{ github.sha }}
          restore-keys: cc-${{ matrix.name }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The Direct3D 12 backend on WARP (the pinned NuGet WARP next to the test executable):
      # runs without a GPU, with the debug layer and GPU-based validation.
      - name: Direct3D 12 render tests (WARP)
        if: runner.os == 'Windows'
        run: out/build/${{ matrix.preset }}/tests/render/blue_render_tests --backend=d3d12 --adapter=software --gpu-validation

  # The headless simulation core the Rust dedicated server links (BLUE_SIM_ONLY): built with
  # only what the server's Linux container has (cmake, make, gcc/g++, git), so no Vulkan SDK,
  # windowing packages, ninja or compiler cache.
  linux-sim:
    name: linux-sim
    runs-on: ubuntu-latest
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-sim-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'tests/sim/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset linux-sim

      - name: Build
        run: cmake --build --preset linux-sim --parallel

      - name: Test
        run: ctest --preset linux-sim

      - name: Link manifest
        run: |
          cat out/build/linux-sim/blue_sim_c.link out/build/linux-sim/blue_sim_c.syslibs
          xargs -a out/build/linux-sim/blue_sim_c.link ls -l

  # Rust dedicated server (server/). `cargo test` builds the native code
  # (blue_sim_c + netcode) through crates/blue-native/build.rs, which runs the
  # BLUE_SIM_ONLY CMake build inside the cargo target directory.
  # Follow-up: build server/Dockerfile here once a registry is chosen.
  server:
    name: server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # rustup reads server/rust-toolchain.toml (channel + clippy, rustfmt)
      # and installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: server-${{ runner.os }}-${{ hashFiles('server/rust-toolchain.toml', 'server/Cargo.lock', 'CMakeLists.txt', 'cmake/**', 'src/**') }}
          restore-keys: |
            server-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
