name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc-debug,    os: windows-latest, preset: x64-debug }
          - { name: windows-msvc-release,  os: windows-latest, preset: x64-release }
          - { name: linux-gcc-debug,       os: ubuntu-latest,  preset: linux-gcc-debug }
          - { name: linux-gcc-release,     os: ubuntu-latest,  preset: linux-gcc-release }
          - { name: linux-clang-debug,     os: ubuntu-latest,  preset: linux-clang-debug }
          - { name: linux-clang-release,   os: ubuntu-latest,  preset: linux-clang-release }
          - { name: macos-arm64-debug,     os: macos-latest,   preset: macos-arm64-debug }
          - { name: macos-arm64-release,   os: macos-latest,   preset: macos-arm64-release }
    env:
      # Dependencies are fetched once per runner and cached below.
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld ccache zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libvulkan-dev glslang-tools \
            libshaderc-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja ccache molten-vk vulkan-headers vulkan-loader shaderc

      - name: Install Windows packages
        if: runner.os == 'Windows'
        run: choco install ninja sccache --no-progress -y

      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Shaderc
          vulkan-use-cache: true

      - name: Developer command prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'tests/CMakeLists.txt') }}

      - name: Cache compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ~/AppData/Local/Mozilla/sccache
          key: cc-${{ matrix.name }}-${{ github.sha }}
          restore-keys: cc-${{ matrix.name }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
